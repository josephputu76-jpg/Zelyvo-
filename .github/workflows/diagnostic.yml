name: Zelyvo Diagnostic

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Versions installées
        run: npm ls expo react react-native expo-asset expo-status-bar @expo/vector-icons --depth=0
        continue-on-error: true

      - name: Vérifier la compatibilité Expo
        run: npx expo install --check
        continue-on-error: true

      - name: Expo Doctor
        run: npx expo-doctor
        continue-on-error: true
